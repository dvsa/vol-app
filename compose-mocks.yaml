# Local stand-ins for GOV.UK One Login and the DVSA Address Service. Start the stack with both files:
#
#   docker compose -f compose.yaml -f compose-mocks.yaml up -d
#
# or put COMPOSE_FILE=compose.yaml:compose-mocks.yaml in the root .env file. See
# "Mock GOV.UK One Login and address lookup" in docs/app/local-setup.

x-local-mocks: &local-mocks # switches on app/api/config/autoload/mocks.global-development.php
  VOL_LOCAL_MOCKS: 1

services:
  api:
    environment: *local-mocks

  cli:
    environment: *local-mocks

  # One container that answers to two names. It is built from the vol-terraform repository, which
  # has to be checked out next to this one (set VOL_TERRAFORM_DIR if yours is somewhere else).
  mock-govuk-signin:
    build:
      context: ${VOL_TERRAFORM_DIR:-../vol-terraform}/docker/mock-govuk-signin
      target: ecs
    expose:
      - 80
    environment:
      # Port 80, so that the browser (through the proxy) and the API (straight to this container,
      # by the aliases below) both reach it at the address it gives as its issuer.
      PORT: 80
      ISSUER_URL: http://mocksignin.local.olcs.dev-dvsacloud.uk
      ADDRESS_HOSTNAME: mockaddress.local.olcs.dev-dvsacloud.uk
      VIRTUAL_HOST: mocksignin.local.olcs.dev-dvsacloud.uk,mockaddress.local.olcs.dev-dvsacloud.uk
      VIRTUAL_PORT: 80
    networks:
      default:
        aliases:
          - mocksignin.local.olcs.dev-dvsacloud.uk
          - mockaddress.local.olcs.dev-dvsacloud.uk
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
