<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New letter dialog harness</title>
    <style>
      /* The rules that make the dialog scroll, as they are in the built stylesheet (which is a
         build output, so it can't be linked from here) */
      .modal__wrapper,
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .modal__wrapper {
        overflow: auto;
        z-index: 6;
      }
      .modal {
        margin: 5% auto;
        max-width: 600px;
        position: relative;
        background: #fff;
        z-index: 2;
      }
      .disable-scroll {
        overflow: hidden;
      }
      /* The real form runs to a few screens before Create letter: every group of issues, the
         appendices and the choices */
      .rest-of-the-form {
        height: 1000px;
      }
    </style>
  </head>
  <body>
    <!--
      The internal app's New letter dialog script (letter-generation.js), run in the app's own
      modal (modal.js and what it needs), on the form the dialog shows: the picker of letters
      already sent, and two groups of issues that start closed. Each option carries the issues
      its letter covered, as the form's own issue ids. The step shown after a letter is created
      sits beside the form, as it does in create.phtml.

      $.ajax is replaced by a stand-in for the server: what the form posts is kept in
      window.posted, and window.serverAnswer is what comes back.
    -->
    <div class="page-wrapper"><h1>Application</h1></div>

    <template id="create-letter-dialog">
      <form id="letter-create-form" data-generate-url="/letter/generate?template=5&application=8">
        <div id="validation-error" style="display: none"><span id="validation-error-text"></span></div>

        <select id="previous-letter" name="startFromLetter">
          <option value="">Select a letter</option>
          <option value="392" data-issue-ids="1,15">11/11/2026 16:24 - First request - 2 issues</option>
          <option value="388" data-issue-ids="5">10/11/2026 09:05 - Final request - 1 issue</option>
          <!-- 99 and 98 have been switched off since, so the form doesn't list them -->
          <option value="385" data-issue-ids="16,99,98">09/11/2026 12:00 - First request - 3 issues</option>
          <option value="380" data-issue-ids="1,99">08/11/2026 12:00 - First request - 2 issues</option>
        </select>
        <p id="previous-letter-note" style="display: none"></p>

        <a href="#" id="toggle-all-sections">Show All Sections</a>

        <div class="letter-sections">
          <div class="letter-section" id="adverts">
            <div class="letter-section__header">
              <h3 class="letter-section__title">Adverts</h3>
              <span class="letter-section__toggle"><span class="letter-section__show-hide">Show</span></span>
            </div>
            <div class="letter-section__content" style="display: none">
              <input type="checkbox" name="letterIssues[]" id="letter-issue-1" value="1" />
              <label for="letter-issue-1">Publication newspaper is unclear</label>
              <input type="checkbox" name="letterIssues[]" id="letter-issue-5" value="5" />
              <label for="letter-issue-5">Advert evidence is missing</label>
            </div>
          </div>

          <div class="letter-section" id="finances">
            <div class="letter-section__header">
              <h3 class="letter-section__title">Finances</h3>
              <span class="letter-section__toggle"><span class="letter-section__show-hide">Show</span></span>
            </div>
            <div class="letter-section__content" style="display: none">
              <input type="checkbox" name="letterIssues[]" id="letter-issue-15" value="15" />
              <label for="letter-issue-15">No financial evidence</label>
              <input type="checkbox" name="letterIssues[]" id="letter-issue-16" value="16" />
              <label for="letter-issue-16">Funds only shown as a balance</label>
            </div>
          </div>
        </div>

        <div class="rest-of-the-form"></div>
        <button type="button" id="create-letter-btn" disabled>Create letter</button>
      </form>

      <div id="letter-preview-modal" style="display: none">
        <p><strong>Template</strong><br /><span id="preview-template">-</span></p>
        <h3>Check and edit your letter</h3>
        <p><a href="#" id="preview-link">View or edit letter (opens in new tab)</a></p>
        <button type="button" id="prepare-to-send-btn">Prepare to send</button>
      </div>
    </template>

    <script src="../../node_modules/jquery/dist/jquery.min.js"></script>
    <script>
      // the app's logger is an object, not a function
      window.OLCS = {
        logger: {
          debug: function () {},
          verbose: function () {},
          info: function () {},
          warn: function () {},
          error: function () {},
          group: function () {},
          groupEnd: function () {},
        },
      };
    </script>
    <script src="../../assets/_js/components/eventEmitter.js"></script>
    <script src="../../assets/_js/components/generateCSSSelector.js"></script>
    <script src="../../assets/_js/components/formHelper.js"></script>
    <script src="../../assets/_js/components/ready.js"></script>
    <script src="../../assets/_js/components/modal.js"></script>
    <script>
      window.posted = [];
      // what the controller sends once a letter is created
      window.serverAnswer = { success: true, letterInstanceId: 401, warnings: [], wordingCopiedTo: [] };
      $.ajax = function (options) {
        window.posted.push(options.data);
        setTimeout(function () {
          options.success(window.serverAnswer);
        }, 0);
      };
    </script>
    <script src="../../../internal/module/Olcs/assets/js/inline/forms/letter-generation.js"></script>
    <script>
      $(function () {
        OLCS.modal.show(document.getElementById("create-letter-dialog").innerHTML, "Generate letter");
      });
    </script>
  </body>
</html>
