name: PHP

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      project:
        type: string
        required: true
      artefact-name:
        type: string
        required: false
      should-upload-artefact:
        type: boolean
        required: false
        default: false
      retention-days:
        type: number
        required: false
        default: 7
      version:
        type: string
        required: false
      skip-checks:
        description: "Skip the test and static-analysis jobs and package straight from the ref. Intended for branch stand-ups where CI has already run on the PR."
        type: boolean
        required: false
        default: false

jobs:
  test:
    name: Test
    if: ${{ !inputs.skip-checks }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/${{ inputs.project }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || null }}
          sparse-checkout: |
            app/${{ inputs.project }}
            lib
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: intl, pdo_mysql, redis, mbstring, igbinary
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles(format('**/app/{0}/composer.lock', inputs.project)) }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
      - name: Test
        run: vendor/bin/phpunit

  static-analysis:
    name: Static analysis (${{ matrix.tool }})
    if: ${{ !inputs.skip-checks }}
    # One job per tool so they run side by side rather than back to back.
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: PHPStan
            command: composer run-script phpstan
          - tool: PHP CodeSniffer
            command: composer run-script phpcs
          # Psalm drops to a single thread for both scanning and analysis when it detects CI, unless told otherwise.
          - tool: Psalm
            command: composer run-script psalm -- --threads=$(nproc) --scan-threads=$(nproc) --force-jit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/${{ inputs.project }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || null }}
          sparse-checkout: |
            app/${{ inputs.project }}
            lib
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: intl, pdo_mysql, redis, mbstring, igbinary
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles(format('**/app/{0}/composer.lock', inputs.project)) }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
      - name: ${{ matrix.tool }}
        run: ${{ matrix.command }}

  package:
    name: Package
    # `needs` cannot be made conditional, so depend on both jobs unconditionally and gate here
    # instead. With skip-checks they report `skipped`, which `always()` lets through.
    if: ${{ always() && !cancelled() && (inputs.skip-checks || (needs.test.result == 'success' && needs.static-analysis.result == 'success')) }}
    needs:
      - test
      - static-analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/${{ inputs.project }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || null }}
          sparse-checkout: |
            app/${{ inputs.project }}
            lib
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: intl, pdo_mysql, redis, mbstring, igbinary
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles(format('**/app/{0}/composer.lock', inputs.project)) }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-dev --optimize-autoloader
      - name: Materialise in-tree libs into vendor
        # composer symlinks path-repo libs (lib/<name>) into vendor/olcs/*. Those
        # relative symlinks resolve on the runner but dangle once the tarball is
        # ADDed into the container image (only the app dir is shipped, not lib/).
        # Replace each with a real copy so the packaged artefact is self-contained.
        run: |
          for link in vendor/olcs/*; do
            if [ -L "$link" ]; then
              target=$(cd "$link" && pwd -P)
              rm "$link"
              cp -a "$target" "$link"
            fi
          done
      - name: Write version file
        if: ${{ inputs.version }}
        run: echo "${{ inputs.version }}" > config/version
      - name: Archive
        run: tar -czf ${{ inputs.project }}.tar.gz *
      - name: Upload artefact
        if: ${{ inputs.should-upload-artefact }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artefact-name }}
          path: app/${{ inputs.project }}/${{ inputs.project }}.tar.gz
          retention-days: ${{ inputs.retention-days }}
