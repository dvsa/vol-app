name: PHP Lib

# Runs an in-tree shared library's own quality suite (test + phpcs + psalm +
# phpstan) using the library's own pinned tooling in lib/<project>/. This
# replaces the per-repo CI that each library had before it was absorbed into
# the monorepo (see docs: monorepo library absorption).

on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      php-version:
        type: string
        required: false
        default: "8.4"

jobs:
  checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # Every job repeats ~25s of setup, so a check only gets a job of its own when it takes far
        # longer than that: olcs-common's Psalm. Everything else in the libraries takes seconds and
        # shares one job. Decided here rather than by the caller so CI and CD lay them out the same.
        # See "PHP checks" in docs/ci-cd.md.
        include: ${{ fromJSON(inputs.project == 'olcs-common' && '[{"name":"Psalm","psalm":true},{"name":"Test, PHP CodeSniffer, PHPStan","test":true,"phpcs":true,"phpstan":true}]' || '[{"name":"Checks","test":true,"phpcs":true,"psalm":true,"phpstan":true}]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/${{ inputs.project }}
    steps:
      - uses: actions/checkout@v6
        with:
          # All of lib/, not just the project under test: in-tree libs can depend
          # on each other via relative path repositories (e.g. olcs-utils requires
          # olcs-logging for its test suite).
          sparse-checkout: lib
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          # igbinary + redis: olcs-transfer/olcs-common require ext-igbinary and
          # exercise the redis-backed cache encryption in their test suites.
          extensions: intl, mbstring, igbinary, redis
          # The library's phpstan script has no --memory-limit flag; phpstan's
          # parallel workers crash under the default 128M, so lift the cap.
          ini-values: memory_limit=-1
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-lib-${{ inputs.project }}-php${{ inputs.php-version }}-${{ hashFiles(format('**/lib/{0}/composer.lock', inputs.project)) }}
          restore-keys: ${{ runner.os }}-composer-lib-${{ inputs.project }}-php${{ inputs.php-version }}-
      - name: Install dependencies
        id: install
        run: composer install --no-progress --prefer-dist
      # One step per check, each run even if an earlier one failed, so one failure cannot hide another.
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.test }}
        run: composer run-script test
      - name: PHP CodeSniffer
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.phpcs }}
        run: composer run-script phpcs
      - name: Psalm
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.psalm }}
        # Psalm drops to a single thread for both scanning and analysis when it detects CI, unless told otherwise.
        run: composer run-script psalm -- --threads="$(nproc)" --scan-threads="$(nproc)"
      - name: PHPStan
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.phpstan }}
        run: composer run-script phpstan
