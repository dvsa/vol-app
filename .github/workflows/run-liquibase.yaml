name: Run Liquibase Migrations

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Target AWS account"
        required: true
        type: choice
        options:
          - nonprod
          - prod
      environment:
        description: "Environment to target"
        type: choice
        options:
          - reg
          - dev
          - int
          - prep
          - prod
        required: true
      etl_ref:
        description: "olcs-etl ref to bundle as the changelog: branch, tag or commit sha"
        required: false
        type: string
        default: "main"
      release_tag:
        description: "Release build only: tag to create in olcs-etl and apply to the image (e.g. release-v9.4.0). Requires branch_build unticked."
        required: false
        type: string
        default: ""
      branch_build:
        description: "Never write the latest tag (default for ad-hoc runs)"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Run in dry-run mode (show pending changes only)"
        required: true
        type: boolean
        default: true
      submit_job:
        description: "Submit the AWS Batch job after building"
        required: true
        type: boolean
        default: false
      ref:
        description: "vol-app ref to checkout (Dockerfile, entrypoint, scripts)"
        required: false
        type: string
        default: "main"
  workflow_call:
    inputs:
      account:
        type: string
        required: true
      environment:
        type: string
        required: true
      etl_ref:
        type: string
        required: false
        default: "main"
        description: "olcs-etl ref to bundle as the changelog: branch, tag or commit sha"
      release_tag:
        type: string
        required: false
        default: ""
        description: "Release build only: tag to create in olcs-etl and apply to the image"
      branch_build:
        type: boolean
        required: false
        default: false
        description: "Never write the latest tag"
      previous_image_tag:
        type: string
        required: false
        default: ""
        description: "Image tag the environment ran before this deploy, for the no-op warning"
      dry_run:
        type: boolean
        required: false
        default: false
      submit_job:
        type: boolean
        required: false
        default: false
      ref:
        type: string
        required: false
        default: "main"
        description: "vol-app ref to checkout (Dockerfile, entrypoint, scripts)"
    outputs:
      etl_sha:
        value: ${{ jobs.build.outputs.etl_sha }}
      etl_short:
        value: ${{ jobs.build.outputs.etl_short }}
      image_digest:
        value: ${{ jobs.build.outputs.image_digest }}
    secrets:
      VOL_GITHUB_APP_PRIVATE_KEY:
        required: true

env:
  REGISTRY: 054614622558.dkr.ecr.eu-west-1.amazonaws.com
  AWS_REGION: ${{ vars.DVSA_AWS_REGION }}
  AWS_OIDC_ROLE: ${{ inputs.account == 'prod' && vars.ACCOUNT_PROD_TF_OIDC_ROLE || vars.ACCOUNT_NONPROD_TF_OIDC_ROLE }}
  BATCH_QUEUE: ${{
    inputs.environment == 'reg'  && 'LQBASE_QUEUE_REG'  ||
    inputs.environment == 'dev'  && 'LQBASE_QUEUE_DEV'  ||
    inputs.environment == 'int'  && 'LQBASE_QUEUE_INT'  ||
    inputs.environment == 'prep' && 'LQBASE_QUEUE_PREP' ||
    inputs.environment == 'prod' && 'LQBASE_QUEUE_PROD'
    }}

jobs:
  build:
    environment: ${{ inputs.environment }}
    outputs:
      etl_sha: ${{ steps.resolve.outputs.etl_sha }}
      etl_short: ${{ steps.resolve.outputs.etl_short }}
      image_digest: ${{ steps.tag.outputs.image_digest }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Validate inputs
        if: ${{ inputs.branch_build && inputs.release_tag != '' }}
        run: |
          echo "::error::release_tag cannot be combined with branch_build"
          exit 1

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.VOL_GITHUB_APP_ID }}
          private-key: ${{ secrets.VOL_GITHUB_APP_PRIVATE_KEY }}
          owner: dvsa
          repositories: olcs-etl

      - name: Resolve olcs-etl ref
        id: resolve
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ETL_REF: ${{ inputs.etl_ref }}
        run: |
          set -o pipefail
          bash .github/scripts/liquibase/resolve-etl-ref.sh "$ETL_REF" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout olcs-etl at the resolved commit
        uses: actions/checkout@v6
        with:
          repository: dvsa/olcs-etl
          path: infra/docker/liquibase/changelog
          ref: ${{ steps.resolve.outputs.etl_sha }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}

      - name: Check whether the sha image already exists
        id: check-image
        run: |
          if aws ecr describe-images --repository-name vol-app/liquibase --image-ids "imageTag=${{ steps.resolve.outputs.etl_short }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push the sha image
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./infra/docker/liquibase
          push: true
          provenance: false
          platforms: linux/arm64
          build-args: |
            ETL_SHA=${{ steps.resolve.outputs.etl_sha }}
          tags: ${{ env.REGISTRY }}/vol-app/liquibase:${{ steps.resolve.outputs.etl_short }}
          cache-from: type=gha,scope=liquibase
          cache-to: type=gha,mode=max,scope=liquibase

      - name: Tag image and read digest
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ETL_SHORT: ${{ steps.resolve.outputs.etl_short }}
        run: |
          set -o pipefail
          extra=()
          if [ -n "$RELEASE_TAG" ]; then
            extra+=("$RELEASE_TAG" latest)
          fi
          bash .github/scripts/liquibase/ecr-tag-image.sh vol-app/liquibase "$ETL_SHORT" "${extra[@]}" | tee "$RUNNER_TEMP/tag.out"
          grep '^image_digest=' "$RUNNER_TEMP/tag.out" >> "$GITHUB_OUTPUT"

      - name: Tag olcs-etl for the release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ETL_SHA: ${{ steps.resolve.outputs.etl_sha }}
        run: bash .github/scripts/liquibase/create-etl-tag.sh "$RELEASE_TAG" "$ETL_SHA"

      - name: Summary
        env:
          ETL_REF: ${{ inputs.etl_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            echo "#### Liquibase image"
            echo "- olcs-etl ref \`$ETL_REF\` resolved to \`${{ steps.resolve.outputs.etl_sha }}\`"
            echo "- image \`vol-app/liquibase:${{ steps.resolve.outputs.etl_short }}\` digest \`${{ steps.tag.outputs.image_digest }}\` (built: ${{ steps.check-image.outputs.exists != 'true' }})"
            echo "- release tag: \`${RELEASE_TAG:-none}\`; branch build: ${{ inputs.branch_build }}"
          } >> "$GITHUB_STEP_SUMMARY"

  submit-batch-job:
    outputs:
      job_id: ${{ steps.submit-job.outputs.job_id }}
      job_status: ${{ steps.check-status.outputs.status }}
    needs: build
    if: ${{ inputs.submit_job }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: .github/scripts/liquibase

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Submit AWS Batch job
        id: submit-job
        run: |
          JOB_ID=$(aws batch submit-job \
          --job-name "liquibase-${{ inputs.environment }}-${{ needs.build.outputs.etl_short }}-${{ github.run_id }}-${{ github.run_attempt }}" \
          --job-queue "${{ vars[env.BATCH_QUEUE] }}" \
          --job-definition "${{ vars[env.BATCH_QUEUE] }}" \
          --container-overrides "{
           \"environment\": [
             {\"name\": \"DRY_RUN\", \"value\": \"${{ inputs.dry_run }}\"},
             {\"name\": \"ENVIRONMENT\", \"value\": \"${{ inputs.environment }}\"}
           ]
          }" \
          --scheduling-priority-override 1 \
          --share-identifier "volapp" \
          --query 'jobId' \
          --output text)
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for job completion
        id: check-status
        timeout-minutes: 30
        run: |
          while true; do
            STATUS=$(aws batch describe-jobs --jobs "${{ steps.submit-job.outputs.job_id }}" --query 'jobs[0].status' --output text)
            if [[ "$STATUS" == "SUCCEEDED" || "$STATUS" == "FAILED" ]]; then
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              echo "Job status: $STATUS"
              break
            fi
            echo "Job status: $STATUS"
            sleep 30
          done

      - name: Summarise migration output
        if: ${{ always() && steps.submit-job.outputs.job_id != '' }}
        env:
          BATCH_LOG_GROUP: /aws/batch/${{ vars[env.BATCH_QUEUE] }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          bash .github/scripts/liquibase/summarise-batch-job.sh \
            "${{ steps.submit-job.outputs.job_id }}" \
            "${{ needs.build.outputs.etl_sha }}" \
            "${{ needs.build.outputs.image_digest }}" \
            "${{ inputs.previous_image_tag }}"
          if [ "${{ steps.check-status.outputs.status }}" != "SUCCEEDED" ]; then
            echo "::error::Batch job ${{ steps.submit-job.outputs.job_id }} finished ${{ steps.check-status.outputs.status || 'unknown' }}"
            exit 1
          fi
