name: Deploy documentation

on:
  workflow_call:
    inputs:
      deploy:
        description: "Whether to deploy"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.id || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            website
            docs
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      # Docusaurus moves this: 3.9 wrote the site to build/<baseUrl>/, 3.10 writes it to build/.
      # A hardcoded path is therefore invalidated by an ordinary minor bump, and because the
      # upload below only runs on a real deploy, CI stayed green while the deploy broke. So
      # resolve the root from the build rather than assuming it, and run ungated so a PR that
      # changes the layout fails here instead. 404.html is emitted exactly once, at the site
      # root, which makes it the marker - and a count other than one means the assumption no
      # longer holds, which is worth failing on rather than guessing past.
      - name: Resolve site root
        id: site
        run: |
          count=$(find build -name 404.html | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one 404.html under website/build, found $count. The Docusaurus build output layout has changed - update the deploy artefact path."
            find build -name 404.html
            exit 1
          fi
          dir=$(dirname "$(find build -name 404.html)")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Site root: website/$dir" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pages artefact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/${{ steps.site.outputs.dir }}

  deploy:
    name: Deploy
    if: ${{ inputs.deploy }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
