name: Deploy documentation

on:
  workflow_call:
    inputs:
      deploy:
        description: "Whether to deploy"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.id || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            website
            docs
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: website/package-lock.json
      # Install scripts are off (website/.npmrc): docmd's optional native engine downloads a binary
      # from a CDN outside npm's integrity checks, and the JavaScript engine it falls back to is
      # fast enough for this site.
      - run: npm ci
      # Fails on a relative link to a page that doesn't exist. docmd's build doesn't check links
      # itself, so this is the gate.
      - name: Check links
        run: npm run validate
      - run: npm run build
      # Site generators have moved this before: Docusaurus 3.9 wrote the site to
      # build/<baseUrl>/ and 3.10 to build/. Because the upload below only runs on a real deploy,
      # a moved root left CI green while the deploy broke. So resolve the root from the build
      # rather than assuming it, and run ungated so a PR that changes the layout fails here
      # instead. 404.html is emitted exactly once, at the site root, which makes it the marker -
      # and a count other than one means the assumption no longer holds, which is worth failing on
      # rather than guessing past.
      - name: Resolve site root
        id: site
        run: |
          count=$(find build -name 404.html | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one 404.html under website/build, found $count. The docs site build output layout has changed - update the deploy artefact path."
            find build -name 404.html
            exit 1
          fi
          dir=$(dirname "$(find build -name 404.html)")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Site root: website/$dir" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload pages artefact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/${{ steps.site.outputs.dir }}

  deploy:
    name: Deploy
    if: ${{ inputs.deploy }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
