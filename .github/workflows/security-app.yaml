name: Security
permissions:
  contents: read
  security-events: write

on:
  workflow_call:
  schedule:
    # Weekly on Monday at 00:00 UTC
    - cron: 0 0 * * 1

jobs:
  app-scan:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # label is the check name branch protection sees - keep these byte-identical.
        # Only code that ends up in a deployed artefact belongs here: a finding fails this workflow
        # and ci.yaml gates the Docker builds on its result. The documentation site is scanned in
        # security-documentation.yaml so its findings show red without blocking a release.
        include:
          - label: App - api
            name: api
            path: app/api
          - label: App - internal
            name: internal
            path: app/internal
          - label: App - selfserve
            name: selfserve
            path: app/selfserve
          - label: App - cdn
            name: cdn
            path: app/cdn
    steps:
      - uses: actions/checkout@v6
      - name: Setup Snyk
        uses: snyk/actions/setup@master
      - name: Scan ${{ matrix.name }}
        run: snyk test ${{ matrix.path }} --sarif-file-output=${{ matrix.name }}-snyk-results.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Fix SARIF security-severity values
        if: ${{ always() }}
        run: |
          if [ -f "${{ matrix.name }}-snyk-results.sarif" ]; then
            jq '(.runs[].tool.driver.rules // [])[] |= (
              if .properties["security-severity"] == null or .properties["security-severity"] == "undefined" then
                .properties["security-severity"] = "5.0"
              else
                .
              end
            )' "${{ matrix.name }}-snyk-results.sarif" > "${{ matrix.name }}-snyk-results-fixed.sarif"
            mv "${{ matrix.name }}-snyk-results-fixed.sarif" "${{ matrix.name }}-snyk-results.sarif"
          fi
      - name: Upload Results to GitHub Code Scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.name }}-snyk-results.sarif
          category: snyk-${{ matrix.name }}
