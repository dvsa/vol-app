; Development-only PHP settings for the api, cli, selfserve and internal containers. compose.yaml
; mounts this directory into each of them and has PHP scan it after the image's own conf.d, so these
; settings override the shared ones in php.ini. Restart the containers after changing them.

[opcache]
; OPcache stays on in development: without it every request recompiles about a thousand
; files read through the bind mount. revalidate_freq=0 checks timestamps on every request,
; so an edited file is picked up by the next request.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531
; Not on the command line, where every process would compile into a cache of its own that nothing
; reuses: tests, Composer and the cli container only pay for it in memory and time.
opcache.enable_cli=0

[xdebug]
; Xdebug is installed but off. XDEBUG_MODE in the root .env file turns it on for every request, and
; `php -d xdebug.mode=...` turns it on for one command. See docs/app/local-setup.
xdebug.mode=off
xdebug.client_host=host.docker.internal
xdebug.start_with_request=yes
xdebug.log=/tmp/xdebug.log
