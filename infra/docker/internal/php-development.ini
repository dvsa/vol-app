; Development-only PHP settings. The development stage copies this to conf.d/zzzzz-development.ini,
; which sorts after zzzz-php.ini, so these settings override the shared ones in php.ini.

[opcache]
; OPcache stays on in development: without it every request recompiles about a thousand
; files read through the bind mount. revalidate_freq=0 checks timestamps on every request,
; so an edited file is picked up by the next request.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=32531

[xdebug]
; The mode comes from the XDEBUG_MODE environment variable, which is "off" unless it is set,
; for example to "debug" in the root .env file. See docs/app/local-setup.
xdebug.client_host=host.docker.internal
xdebug.start_with_request=yes
xdebug.log=/tmp/xdebug.log
